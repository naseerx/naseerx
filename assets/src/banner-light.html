<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400..700;1,7..72,400..700&family=IBM+Plex+Mono:wght@400;600&display=block" rel="stylesheet"><style>
*{margin:0;box-sizing:border-box}
html,body{width:1280px;height:460px;overflow:hidden}
body{background:#f3f2ec;color:#1c1917;font-family:Literata,Georgia,serif;font-variant-numeric:lining-nums}
.wrap{position:absolute;inset:0;padding:44px 56px 0;display:flex;flex-direction:column}
.top{display:flex;align-items:center;justify-content:space-between;font-family:'IBM Plex Mono',monospace;font-size:15px;letter-spacing:.07em;text-transform:uppercase;color:#6b5e58}
.brand{display:flex;align-items:center;gap:14px}
.mark{width:38px;height:38px;border-radius:3px;background:#800000;color:#f6efe2;font-family:Literata,Georgia,serif;font-weight:600;font-size:16px;letter-spacing:.04em;display:flex;align-items:center;justify-content:center}
h1{font-weight:500;font-size:92px;line-height:1;letter-spacing:-.032em;margin-top:auto}
.role{font-style:italic;font-weight:450;font-size:46px;line-height:1.1;letter-spacing:-.02em;color:#800000;margin-top:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);margin-top:40px;border-top:1px solid #1c1917}
.stats div{padding:18px 28px 24px;border-left:1px solid rgba(28,25,23,.16);display:flex;align-items:baseline;gap:14px}
.stats div:first-child{padding-left:0;border-left:0}
.stats b{font-weight:500;font-size:40px;letter-spacing:-.03em}
.stats span{font-family:'IBM Plex Mono',monospace;font-size:14px;letter-spacing:.07em;text-transform:uppercase;color:#6b5e58}
</style></head><body><div class="wrap">
<div class="top"><div class="brand"><div class="mark">MN</div><span>Peshawar, Pakistan · UTC+5</span></div><span>naseer.pk</span></div>
<h1>Muhammad Naseer</h1>
<div class="role">Flutter Developer</div>
<div class="stats"><div><b>20+</b><span>Apps shipped</span></div><div><b>1.2M+</b><span>Downloads</span></div><div><b>4+ yrs</b><span>iOS &amp; Android</span></div></div>
</div></body></html>
